cubes:
  - name: fact_games
    sql_table: silver.fact_games
    data_source: default
    title: "Game (Fact)"
    description: "One row per game -- star-schema fact table with resolved dimension keys, built on top of dim_games + dim_game_details. CORRECTION: the previous description claimed home_team_key/away_team_key were 'fixed upstream' to hold genuine surrogate keys -- confirmed FALSE (both are declared type: number in this cube and threw a varchar->bigint error joining to home_teams/away_teams.team_key, a real hash). Joins below now use team_id+season instead. home_pitching_runs_allowed/away_pitching_runs_allowed correctly named (previously mislabeled as _errors); dim_game_status join now matches its full compound key."

    joins:
      - name: dim_date
        sql: "{CUBE}.game_date_key = {dim_date.date_key}"
        relationship: many_to_one

      - name: official_dates
        sql: "{CUBE}.official_date_key = {official_dates.date_key}"
        relationship: many_to_one

      - name: home_teams
        # FIX: the "SIMPLIFIED... fixed upstream" claim was wrong, same as
        # fact_player_stats' identical claim about its _key columns.
        # home_team_key is declared `type: number` right in this cube (see
        # dimensions below) -- a real hash surrogate key would be `string`,
        # matching every other genuine _key field in this project
        # (venue_key/season_key on THIS SAME cube are both `string` and
        # their joins work correctly). Confirmed via a physical test:
        # joining home_team_key to home_teams.team_key (a real hash)
        # throws "Error converting data type varchar to bigint". Reverted
        # to the standard team_id+season compound pattern instead.
        # VERIFY: spot-check that home_team_key's values actually match
        # home_teams.team_id before trusting this join's results.
        # DEFENSIVE: wrapped both join columns in TRY_CONVERT. This join
        # was already switched from team_key (hash) to team_id per the
        # comment above, but the 2026-08-21T17:39 test report still threw
        # "Error converting data type varchar to bigint" on this exact
        # join AFTER that fix -- and dim_draft's identical join to
        # dim_teams.team_id passes cleanly, which rules out team_id itself
        # being the varchar column. Suspect either (a) Cube hadn't
        # reloaded this schema file yet when that test ran, or (b) the
        # varchar column is actually on fact_games' side (home_team_key /
        # season) despite the INFORMATION_SCHEMA claim above -- re-verify
        # against the live schema. TRY_CONVERT is a safety net either way:
        # a no-op if both sides are already numeric, and turns any
        # stray non-numeric row into an excluded (NULL) match instead of
        # failing the whole query.
        sql: "TRY_CONVERT(bigint, {CUBE}.home_team_key) = TRY_CONVERT(bigint, {home_teams.team_id}) AND {CUBE}.season = {home_teams.season}"
        relationship: many_to_one

      - name: away_teams
        # FIX: same issue/fix as home_teams above.
        # DEFENSIVE: TRY_CONVERT added for the same reason -- see the
        # home_teams join comment above.
        sql: "TRY_CONVERT(bigint, {CUBE}.away_team_key) = TRY_CONVERT(bigint, {away_teams.team_id}) AND {CUBE}.season = {away_teams.season}"
        relationship: many_to_one

      - name: dim_venue
        # Cube name/key not confirmed from here -- verify against dim_venue.yml.
        sql: "{CUBE}.venue_key = {dim_venue.venue_key}"
        relationship: many_to_one

      - name: dim_season
        sql: "{CUBE}.season_key = {dim_season.season_key}"
        relationship: many_to_one

      - name: dim_game_type
        sql: "{CUBE}.game_type_key = {dim_game_type.game_type_key}"
        relationship: many_to_one

      - name: dim_game_status
        # NOTE: this key may be unreliable -- the underlying SQL join that
        # produced it only matched on status_code, not the full
        # (coded_game_state, status_code) pair dim_game_status actually
        # needs to be unique. See cube description.
        sql: "{CUBE}.game_status_key = {dim_game_status.game_status_key}"
        relationship: many_to_one

      - name: credited_pitchers
        sql: "{CUBE}.winning_pitcher_id = {credited_pitchers.player_id} AND {credited_pitchers.is_current} = 1"
        relationship: many_to_one

      - name: losing_pitchers
        sql: "{CUBE}.losing_pitcher_id = {losing_pitchers.player_id} AND {losing_pitchers.is_current} = 1"
        relationship: many_to_one

      - name: save_pitchers
        sql: "{CUBE}.save_pitcher_id = {save_pitchers.player_id} AND {save_pitchers.is_current} = 1"
        relationship: many_to_one

    dimensions:
