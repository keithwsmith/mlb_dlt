cubes:
  - name: dim_game_type
    sql_table: silver.dim_game_type
    data_source: default
    title: "Game Type"
    description: "One row per distinct game type code (R, S, P, D, L, W, F, A, E) with its display name."

    joins: []

    dimensions:
      - name: game_type_key
        sql: game_type_key
        type: string
        primary_key: true
        public: false

      - name: game_type_code
        sql: game_type_code
        type: string
        title: "Game Type Code"

      - name: game_type_name
        sql: game_type_name
        type: string
        title: "Game Type"

    measures:
      - name: count
        type: count
        title: "Number of Game Types"

    pre_aggregations:
      # Deliberately left empty -- small reference/lookup table, not a
      # good pre-aggregation candidate (same reasoning as dim_award).