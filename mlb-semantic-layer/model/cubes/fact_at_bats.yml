cubes:
  - name: fact_at_bats
    sql_table: silver.fact_at_bats
    data_source: default
    title: "At-Bat"
    description: "One row per at-bat (all pitches within it collapsed to one summary row). pitcher_id is the pitcher credited with the at-bat (threw the final/deciding pitch); first_pitcher_id differs when there was a mid-at-bat pitching substitution (pitchers_in_ab > 1 flags that). NOTE: this model's dbt config is missing materialized='incremental' despite using is_incremental() in its WHERE clause -- that condition is currently always false, so this silently full-rebuilds every run rather than incrementing. Worth fixing in the SQL separately from this cube."

    joins:
      - name: dim_games
        sql: "{CUBE}.game_pk = {dim_games.game_pk}"
        relationship: many_to_one

      - name: credited_pitchers
        sql: "{CUBE}.pitcher_id = {credited_pitchers.player_id} AND {credited_pitchers.is_current} = 1"
        relationship: many_to_one

      - name: first_pitchers
        sql: "{CUBE}.first_pitcher_id = {first_pitchers.player_id} AND {first_pitchers.is_current} = 1"
        relationship: many_to_one

      - name: at_bat_batters
        sql: "{CUBE}.batter_id = {at_bat_batters.player_id} AND {at_bat_batters.is_current} = 1"
        relationship: many_to_one

    dimensions:
      - name: game_pk
        sql: game_pk
        type: number
        primary_key: true
        public: false

      - name: at_bat_index
        sql: at_bat_index
        type: number
        primary_key: true
        public: false

      - name: batter_id
        sql: batter_id
        type: number
        primary_key: true
        public: false
        # Composite grain matches this model's GROUP BY (game_pk,
        # season, at_bat_index, batter_id) -- season omitted from the
        # key since (game_pk, at_bat_index, batter_id) alone is already
        # unique.

      - name: season
        sql: season
        type: number

      - name: batter_name
        sql: batter_name
        type: string
        title: "Batter"

      - name: batter_side
        sql: batter_side
        type: string
        title: "Batter Side"

      - name: pitcher_id
        sql: pitcher_id
        type: number
        public: false

      - name: pitcher_name
        sql: pitcher_name
        type: string
        title: "Pitcher"

      - name: pitcher_hand
        sql: pitcher_hand
        type: string
        title: "Pitcher Hand"

      - name: first_pitcher_id
        sql: first_pitcher_id
        type: number
        public: false

      - name: pitchers_in_ab
        sql: pitchers_in_ab
        type: number
        title: "Pitchers Used"
        # >1 means a mid-at-bat pitching substitution happened -- compare
        # pitcher_id vs first_pitcher_id to see who came in.

      - name: final_balls
        sql: final_balls
        type: number
        title: "Final Ball Count"

      - name: final_strikes
        sql: final_strikes
        type: number
        title: "Final Strike Count"

      - name: outs_when_up
        sql: outs_when_up
        type: number
        title: "Outs When Up"

      - name: ended_in_play
        sql: ended_in_play
        type: number
        public: false

      - name: ended_in_out
        sql: ended_in_out
        type: number
        public: false

      - name: trajectory
        sql: trajectory
        type: string
        title: "Batted Ball Trajectory"

      - name: exit_velocity
        sql: exit_velocity
        type: number
        title: "Exit Velocity"

      - name: launch_angle
        sql: launch_angle
        type: number
        title: "Launch Angle"

      - name: hit_distance
        sql: hit_distance
        type: number
        title: "Hit Distance"

      - name: avg_pitch_speed
        sql: avg_pitch_speed
        type: number
        public: false
        title: "Avg Pitch Speed (this at-bat)"
        # Reference only -- this is already an AVG() over this at-bat's
        # pitches. An avg_of_avg_pitch_speed measure below exists for
        # convenience but is NOT pitch-count-weighted -- see its note.

      - name: max_pitch_speed
        sql: max_pitch_speed
        type: number
        title: "Max Pitch Speed (this at-bat)"

      - name: is_hard_hit
        sql: is_hard_hit
        type: number
        public: false

      - name: is_long_ab
        sql: is_long_ab
        type: number
        public: false

      - name: ab_start_time
        sql: ab_start_time
        type: time
        title: "At-Bat Start"

      - name: ab_end_time
        sql: ab_end_time
        type: time
        title: "At-Bat End"

      - name: load_id
        sql: load_id
        type: string
        public: false

    measures:
      - name: count
        type: count
        title: "Number of At-Bats"

      - name: distinct_batters
        sql: batter_id
        type: count_distinct
        title: "Distinct Batters"

      - name: distinct_pitchers
        sql: pitcher_id
        type: count_distinct
        title: "Distinct Pitchers"

      - name: total_pitches
        sql: total_pitches
        type: sum
        title: "Total Pitches"

      - name: avg_pitches_per_ab
        sql: total_pitches
        type: avg
        title: "Average Pitches per At-Bat"

      - name: balls_total
        sql: balls_total
        type: sum
        title: "Total Balls"

      - name: strikes_total
        sql: strikes_total
        type: sum
        title: "Total Strikes"

      - name: total_fouls
        sql: fouls
        type: sum
        title: "Total Fouls"

      - name: total_swinging_strikes
        sql: swinging_strikes
        type: sum
        title: "Total Swinging Strikes"

      - name: total_called_strikes
        sql: called_strikes
        type: sum
        title: "Total Called Strikes"

      - name: hard_hit_rate
        sql: is_hard_hit
        type: avg
        title: "Hard-Hit Rate"
        format: percent

      - name: long_ab_rate
        sql: is_long_ab
        type: avg
        title: "Long At-Bat Rate (6+ Pitches)"
        format: percent

      - name: in_play_rate
        sql: ended_in_play
        type: avg
        title: "Ball In Play Rate"
        format: percent

      - name: out_rate
        sql: ended_in_out
        type: avg
        title: "Out Rate"
        format: percent

      - name: avg_exit_velocity
        sql: exit_velocity
        type: avg
        title: "Average Exit Velocity"

      - name: avg_launch_angle
        sql: launch_angle
        type: avg
        title: "Average Launch Angle"

      - name: max_pitch_speed_overall
        sql: max_pitch_speed
        type: max
        title: "Fastest Pitch"

      - name: avg_of_avg_pitch_speed
        sql: avg_pitch_speed
        type: avg
        title: "Average Pitch Speed (unweighted)"
        # CAVEAT: this averages each at-bat's own average, NOT weighted
        # by how many pitches were in each at-bat -- a 2-pitch at-bat and
        # a 10-pitch at-bat count equally here. Not pitch-count-accurate;
        # a true weighted average would need to go back to
        # int_pitches_enriched instead.

    pre_aggregations:
      # Real fact-shaped table with a genuine time column (ab_start_time)
      # -- reasonable rollup candidate, e.g. by season/pitcher. Left empty
      # for now pending a concrete query pattern to match.
