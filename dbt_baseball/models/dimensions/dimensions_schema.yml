        description: "Draft type code."
        tests:
          - not_null

      - name: draft_type_description
        description: "Draft type description."
        tests:
          - not_null

      - name: source_dlt_id
        description: "Source dlt row identifier."
        tests:
          - not_null
          - unique

  # ============================================================
  # dim_game_status
  # ============================================================
  - name: dim_game_status
    description: "Distinct game status combinations."
    columns:
      - name: game_status_key
        description: "Surrogate key from coded_game_state."
        tests:
          - not_null
      - name: status__coded_game_state
        description: "Coded game state (e.g. C,D,F,R)."
        tests:
          - not_null

      - name: status__abstract_game_state
        description: "Abstract state (Final, Live, Preview)."
        tests:
          - not_null
          - accepted_values:
              values:
                - Final
                - Live
                - Preview
      - name: status__detailed_state
        description: "Detailed status description."
        tests:
          - not_null
      - name: status__status_code
        description: "Status code."
        tests:
          - not_null
          - unique
      - name: status__abstract_game_code
        description: "Abstract game code."
        tests:
          - not_null

  # ============================================================
  # dim_game_type
  # ============================================================
  - name: dim_game_type
    description: "Reference table of game type codes and names."
    columns:
      - name: game_type_key
        description: "Surrogate key from game_type_code."
        tests:
          - not_null
          - unique

      - name: game_type_code
        description: "Single-character game type code."
        tests:
          - not_null
          - unique
          - accepted_values:
              values: ['R', 'S', 'P', 'D', 'L', 'W', 'F', 'A', 'E']

      - name: game_type_name
        description: "Human-readable game type name."
        tests:
          - not_null
          - accepted_values:
              values:
                - Regular Season
                - Spring Training
                - Postseason
                - Division Series
                - League Championship Series
                - World Series
                - Wild Card
                - All-Star Game
                - Exhibition
                - Unknown

