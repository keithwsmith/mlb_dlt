  # ============================================================
  # gold_batter_pitcher_career
  # ============================================================
  - name: gold_batter_pitcher_career
    description: >
      One row per batter x pitcher across all regular seasons: the career
      head-to-head record, with the same columns and definitions as
      gold_batter_pitcher_season plus the seasons they faced each other.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [batter_id, pitcher_id]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "hits <= at_bats"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "at_bats <= plate_appearances"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "singles + doubles + triples + home_runs = hits"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "intentional_walks <= walks"
    columns:
      - name: matchup_key
        description: Surrogate key from batter_id, pitcher_id.
        tests: [unique, not_null]
      - name: seasons_faced
        description: Seasons in which they faced each other.
      - name: first_season
        description: First season they faced each other.
