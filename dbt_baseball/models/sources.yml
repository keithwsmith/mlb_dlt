version: 2

models:
  - name: player_game_stats
    description: >
      One row per player, per game, capturing that player's participation
      details (team, position) along with their pitching, fielding, and
      batting statistics for the game. Sourced from the [dw].[player_game_stats]
      table, which is loaded via a dlt (data load tool) pipeline — evidenced by
      the `_dlt_load_id` / `_dlt_id` metadata columns. A player may appear on
      only one row per game (grain: game_pk + player_id), but not every player
      will have pitching, fielding, or batting stats populated depending on
      whether they participated in that phase of the game.

    tests:
      # Grain check: exactly one row per player per game
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - game_pk
            - player_id

    columns:
      - name: game_pk
        description: Primary key of the game (from the source game feed). Part of the composite grain of this table along with player_id.
        tests:
          - not_null

      - name: player_id
        description: Unique identifier for the player. Part of the composite grain of this table along with game_pk.
        tests:
          - not_null

      - name: player_name
        description: Full display name of the player at the time of the game.

      - name: team_id
        description: Identifier of the team the player was rostered to for this game.

      - name: team_name
        description: Name of the team the player was rostered to for this game.

      - name: is_home
        description: Boolean flag indicating whether the player's team was the home team (true) or away team (false) for this game.
        tests:
          - accepted_values:
              values: [true, false]
              quote: false
              config:
                severity: warn
                where: "is_home is not null"

      - name: position_code
        description: Numeric/coded identifier for the player's position in this game (source system code).

      - name: position_name
        description: Full name of the player's position in this game (e.g. "Pitcher", "Catcher", "Shortstop").

      - name: position_abbreviation
        description: Abbreviated form of the player's position in this game (e.g. "P", "C", "SS").

      - name: _dlt_load_id
        description: Identifier of the dlt pipeline load/run that produced this row. Used for lineage and incremental load tracking.
        tests:
          - not_null

      - name: _dlt_id
        description: Unique row identifier generated by dlt for this record. Serves as the technical/surrogate primary key of the table.
        tests:
          - not_null
          - unique

      - name: pitching_innings_pitched
        description: >
          Number of innings pitched by the player in this game, stored as text
          (e.g. "6.1") since partial innings are expressed in thirds using a
          non-decimal notation (.1 = 1 out, .2 = 2 outs). Null if the player did not pitch.

      - name: pitching_hits_allowed
        description: Count of hits allowed by the player while pitching in this game.

      - name: pitching_runs_allowed
        description: Count of runs (earned and unearned) allowed by the player while pitching in this game.

      - name: pitching_earned_runs
        description: Count of earned runs allowed by the player while pitching in this game.

      - name: pitching_walks
        description: Count of walks (bases on balls) issued by the player while pitching in this game.

      - name: pitching_strikeouts
        description: Count of strikeouts recorded by the player while pitching in this game.

      - name: pitching_home_runs_allowed
        description: Count of home runs allowed by the player while pitching in this game.

      - name: fielding_putouts
        description: Count of putouts recorded by the player while fielding in this game.

      - name: fielding_assists
        description: Count of assists recorded by the player while fielding in this game.

      - name: fielding_errors
        description: Count of fielding errors committed by the player in this game.

      - name: fielding_chances
        description: Total fielding chances (putouts + assists + errors) for the player in this game.

      - name: batting_at_bats
        description: Count of official at-bats for the player in this game.

      - name: batting_runs
        description: Count of runs scored by the player in this game.

      - name: batting_hits
        description: Count of hits recorded by the player in this game.

      - name: batting_doubles
        description: Count of doubles hit by the player in this game.

      - name: batting_triples
        description: Count of triples hit by the player in this game.

      - name: batting_home_runs
        description: Count of home runs hit by the player in this game.

      - name: batting_rbi
        description: Count of runs batted in (RBI) by the player in this game.

      - name: batting_walks
        description: Count of walks (bases on balls) drawn by the player in this game.

      - name: batting_strikeouts
        description: Count of strikeouts by the player while batting in this game.

      - name: batting_stolen_bases
        description: Count of stolen bases by the player in this game.

      - name: batting_left_on_base
        description: Count of runners left on base while the player was batting in this game.

      - name: batting_avg
        description: >
          Player's batting average for this game, stored as text (e.g. ".333")
          to preserve the source system's leading-decimal-point formatting.

      - name: pitching_era
        description: >
          Player's earned run average for this game, stored as text to
          preserve the source system's formatting (e.g. "0.00", "27.00").