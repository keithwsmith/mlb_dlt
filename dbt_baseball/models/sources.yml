version: 2

sources:
  - name: dw
    database: dlt
    schema: dw
    description: >
      Raw / lightly-transformed tables and views landed in the [dw] schema of
      the [dlt] SQL Server database by the dlt (data load tool) pipeline.
      These are the tables/views models like dim_award and the batting/
      pitching staging models select from via source().

    tables:
      - name: player_game_stats
        description: >
          One row per player, per game, capturing that player's participation
          details (team, position) along with their pitching, fielding, and
          batting statistics for the game. Loaded via a dlt pipeline —
          evidenced by the `_dlt_load_id` / `_dlt_id` metadata columns. A
          player may appear on only one row per game (grain: game_pk +
          player_id), but not every player will have pitching, fielding, or
          batting stats populated depending on whether they participated in
          that phase of the game.

        tests:
          # Grain check: exactly one row per player per game
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - game_pk
                  - player_id

        columns:
          - name: game_pk
            description: Primary key of the game (from the source game feed). Part of the composite grain of this table along with player_id.
            tests:
              - not_null

          - name: player_id
            description: Unique identifier for the player. Part of the composite grain of this table along with game_pk.
            tests:
              - not_null

          - name: player_name
            description: Full display name of the player at the time of the game.

          - name: team_id
            description: Identifier of the team the player was rostered to for this game.

          - name: team_name
            description: Name of the team the player was rostered to for this game.

          - name: is_home
            description: Boolean flag indicating whether the player's team was the home team (true) or away team (false) for this game.
            tests:
              - accepted_values:
                  arguments:
                    values: ["true", "false"]
                    quote: true
                  config:
                    severity: warn
                    where: "is_home is not null"

          - name: position_code
            description: Numeric/coded identifier for the player's position in this game (source system code).

          - name: position_name
            description: Full name of the player's position in this game (e.g. "Pitcher", "Catcher", "Shortstop").

          - name: position_abbreviation
            description: Abbreviated form of the player's position in this game (e.g. "P", "C", "SS").

          - name: _dlt_load_id
            description: Identifier of the dlt pipeline load/run that produced this row. Used for lineage and incremental load tracking.
            tests:
              - not_null

          - name: _dlt_id
            description: Unique row identifier generated by dlt for this record. Serves as the technical/surrogate primary key of the table.
            tests:
              - not_null
              - unique

          - name: pitching_innings_pitched
            description: >
              Number of innings pitched by the player in this game, stored as text
              (e.g. "6.1") since partial innings are expressed in thirds using a
              non-decimal notation (.1 = 1 out, .2 = 2 outs). Null if the player did not pitch.

          - name: pitching_hits_allowed
            description: Count of hits allowed by the player while pitching in this game.

          - name: pitching_runs_allowed
            description: Count of runs (earned and unearned) allowed by the player while pitching in this game.

          - name: pitching_earned_runs
            description: Count of earned runs allowed by the player while pitching in this game.

          - name: pitching_walks
            description: Count of walks (bases on balls) issued by the player while pitching in this game.

          - name: pitching_strikeouts
            description: Count of strikeouts recorded by the player while pitching in this game.

          - name: pitching_home_runs_allowed
            description: Count of home runs allowed by the player while pitching in this game.

          - name: fielding_putouts
            description: Count of putouts recorded by the player while fielding in this game.

          - name: fielding_assists
            description: Count of assists recorded by the player while fielding in this game.

          - name: fielding_errors
            description: Count of fielding errors committed by the player in this game.

          - name: fielding_chances
            description: Total fielding chances (putouts + assists + errors) for the player in this game.

          - name: batting_at_bats
            description: Count of official at-bats for the player in this game.

          - name: batting_runs
            description: Count of runs scored by the player in this game.

          - name: batting_hits
            description: Count of hits recorded by the player in this game.

          - name: batting_doubles
            description: Count of doubles hit by the player in this game.

          - name: batting_triples
            description: Count of triples hit by the player in this game.

          - name: batting_home_runs
            description: Count of home runs hit by the player in this game.

          - name: batting_rbi
            description: Count of runs batted in (RBI) by the player in this game.

          - name: batting_walks
            description: Count of walks (bases on balls) drawn by the player in this game.

          - name: batting_strikeouts
            description: Count of strikeouts by the player while batting in this game.

          - name: batting_stolen_bases
            description: Count of stolen bases by the player in this game.

          - name: batting_left_on_base
            description: Count of runners left on base while the player was batting in this game.

          - name: batting_avg
            description: >
              Player's batting average for this game, stored as text (e.g. ".333")
              to preserve the source system's leading-decimal-point formatting.

          - name: pitching_era
            description: >
              Player's earned run average for this game, stored as text to
              preserve the source system's formatting (e.g. "0.00", "27.00").

      - name: player_stats
        description: >
          Wide, denormalized raw stats table that merges multiple slightly
          different shapes of the same hitting/pitching/fielding stat
          payloads (schema drift across dlt loads: stat__*, hitting__stat__*
          / pitching__stat__* / fielding__stat__*, and batting_stat__* /
          pitching_stat__* / fielding_stat__*). Cleaned, coalesced versions
          are exposed via the vw_batting_stats and vw_pitching_stats views
          below — prefer selecting from those rather than this raw table.

      - name: seasons
        description: >
          Raw season reference data loaded by the dlt pipeline. Used to build
          dim_date. Column-level docs to be filled in once the table's actual
          shape can be inspected — only the table name is needed here to
          satisfy source('dw', 'seasons') and unblock compilation.

      - name: award_recipients
        description: >
          Raw award-recipient records loaded by the dlt pipeline. One row per
          award given to a player (grain not yet fully documented). Distinct
          award_id/award_name pairs from this table are used to build
          dim_award.
        columns:
          - name: award_id
            description: Identifier of the award.
          - name: award_name
            description: Display name of the award.

      - name: draft
        description: >
          Raw draft-pick records loaded by the dlt pipeline. Referenced by
          dim_draft, dim_school (draft pick -> school), and fact_draft.

      - name: games
        description: >
          Raw per-game records loaded by the dlt pipeline (one row per game),
          covering things like game status and game type in addition to core
          game info. Referenced by dim_games, dim_game_status, and
          dim_game_type.

      - name: game_details
        description: >
          Raw detailed per-game data loaded by the dlt pipeline, referenced
          by dim_game_details.

      - name: umpires
        description: >
          Raw umpire assignment records loaded by the dlt pipeline,
          referenced by dim_game_umpires.

      - name: mlbplayers
        description: >
          Raw player biographical/reference records loaded by the dlt
          pipeline, referenced by dim_position.

      - name: rosters
        description: >
          Raw roster records loaded by the dlt pipeline (player-to-team
          assignments over time), referenced by dim_position and
          stg_rosters.

      - name: school_type_lookup
        description: >
          Raw lookup table of school types loaded by the dlt pipeline,
          referenced by dim_school.

      - name: teams
        description: >
          Raw team reference records loaded by the dlt pipeline, referenced
          by dim_team.

      - name: venues
        description: >
          Raw venue/ballpark reference records loaded by the dlt pipeline,
          referenced by dim_venue.

      - name: player_transactions
        description: >
          Raw player transaction records (trades, signings, releases, etc.)
          loaded by the dlt pipeline, referenced by stg_player_transactions.

      - name: play_events
        description: >
          Raw play-by-play event records loaded by the dlt pipeline,
          referenced by stg_play_events.

      - name: vw_batting_stats
        description: >
          SQL Server view over player_stats that coalesces the stat__* /
          hitting__stat__* / batting_stat__* column families into a single
          clean set of batting columns per player/season/team. One row per
          player/season/team batting line; a row is included only if it has
          a non-null at-bats or plate-appearances value.

      - name: vw_pitching_stats
        description: >
          SQL Server view over player_stats that coalesces the stat__* /
          pitching__stat__* / pitching_stat__* column families into a single
          clean set of pitching columns per player/season/team. One row per
          player/season/team pitching line; a row is included only if it has
          a non-null innings-pitched or games-pitched value. Two-way players
          (e.g. a pitcher who also batted) can correctly appear in both this
          view and vw_batting_stats.